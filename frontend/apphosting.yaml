runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512
env:
  - variable: CAPERE_API_URL
    value: https://api.capereai.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_CHAT_URL
    value: https://chat.capereai.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SUPABASE_URL
    secret: CAPERE_SUPABASE_URL
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    secret: CAPERE_SUPABASE_ANON_KEY
    availability: [BUILD, RUNTIME]
