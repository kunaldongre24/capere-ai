runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512
env:
  - variable: AUTH_PROVIDER
    value: firebase
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_PROJECT_ID
    value: capere-ai-786a0
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_WEB_API_KEY
    secret: CAPERE_FIREBASE_WEB_API_KEY
    availability: [RUNTIME]
  - variable: HOSTNAME
    value: 0.0.0.0
    availability: [RUNTIME]
  - variable: CAPERE_API_URL
    value: https://api.capereai.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_CHAT_URL
    value: https://chat.capereai.com
    availability: [BUILD, RUNTIME]
