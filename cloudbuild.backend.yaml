substitutions:
  _REGION: asia-south1
  _SERVICE: capere-backend
  _REPOSITORY: capere
  _PUBLIC_API_URL: https://api.capereai.com

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend:$BUILD_ID
      - --file
      - backend/Dockerfile
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend:$BUILD_ID
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - capere-migrate
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend:$BUILD_ID
      - --region=${_REGION}
      - --service-account=capere-api@$PROJECT_ID.iam.gserviceaccount.com
      - --set-cloudsql-instances=$PROJECT_ID:${_REGION}:capere-postgres
      - --set-env-vars=NODE_ENV=production,DATABASE_SSL_MODE=disable
      - --set-secrets=DATABASE_URL=CAPERE_CLOUDSQL_DATABASE_URL:latest
      - --command=pnpm
      - --args=--filter,@capere/backend,migrate:runtime
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - capere-migrate
      - --region=${_REGION}
      - --wait
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --service-account=capere-api@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:capere-postgres
      - --port=8080
      - --min-instances=1
      - --max-instances=5
      - --concurrency=40
      - --cpu=1
      - --memory=1Gi
      - --timeout=300
      - --allow-unauthenticated
      - --set-env-vars=NODE_ENV=production,AUTH_PROVIDER=firebase,FIREBASE_PROJECT_ID=$PROJECT_ID,DATABASE_SSL_MODE=disable,JOB_DISPATCH_MODE=cloud_tasks,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,CLOUD_TASKS_LOCATION=${_REGION},CLOUD_TASKS_QUEUE=capere-integration-jobs,MANAGED_TASK_AUDIENCE=${_PUBLIC_API_URL},MANAGED_TASK_SERVICE_ACCOUNT=capere-tasks@$PROJECT_ID.iam.gserviceaccount.com,RAG_STORAGE_PROVIDER=gcs,RAG_STORAGE_BUCKET=$PROJECT_ID-rag-sources,DATABASE_POOL_MAX=4,APP_WEB_URL=https://app.capereai.com,CORS_ORIGINS=https://app.capereai.com,GHL_OAUTH_REDIRECT_URI=${_PUBLIC_API_URL}/api/v1/integrations/crm/callback,GOOGLE_OAUTH_REDIRECT_URI=${_PUBLIC_API_URL}/api/v1/integrations/google/callback,DATAFORSEO_PINGBACK_URL=${_PUBLIC_API_URL}/api/v1/integrations/data-for-seo/webhook,VECTOR_STORE_PROVIDER=pgvector
      - --set-secrets=DATABASE_URL=CAPERE_CLOUDSQL_DATABASE_URL:latest,API_KEYS_HASHING_SALT=CAPERE_API_KEYS_HASHING_SALT:latest,KEY_ENCRYPTION_KEY=CAPERE_KEY_ENCRYPTION_KEY:latest,OPENROUTER_API_KEY=CAPERE_OPENROUTER_API_KEY:latest,OPENROUTER_MODELS_GENERAL=CAPERE_OPENROUTER_MODELS_GENERAL:latest,OPENROUTER_MODELS_ANALYTICS=CAPERE_OPENROUTER_MODELS_ANALYTICS:latest,OPENROUTER_MODELS_CHEAP=CAPERE_OPENROUTER_MODELS_CHEAP:latest,GHL_CLIENT_ID=CAPERE_GHL_CLIENT_ID:latest,GHL_CLIENT_SECRET=CAPERE_GHL_CLIENT_SECRET:latest,GHL_SSO_KEY=CAPERE_GHL_SSO_KEY:latest,GOOGLE_CLIENT_ID=CAPERE_GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=CAPERE_GOOGLE_CLIENT_SECRET:latest,GOOGLE_PLACES_API_KEY=CAPERE_GOOGLE_PLACES_API_KEY:latest,DATAFORSEO_LOGIN=CAPERE_DATAFORSEO_LOGIN:latest,DATAFORSEO_PASSWORD=CAPERE_DATAFORSEO_PASSWORD:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
